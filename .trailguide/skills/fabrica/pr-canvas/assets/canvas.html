<title>__PR_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar across the top, section rail at left, a pannable canvas filling the rest; details open as windows on the canvas. */
:root {
  --ink: #272b27; --muted: #6f776c; --faint: #9aa196;
  --canvas: #f4f4ef; --surface: #fbfbf8; --node: #ffffff; --line: #dce0d6; --hover: #eaeee4;
  --accent: #4d638b; --accent-soft: #e8edf5; --focus-ring: #4d638b33;
  --new: #3f7a49; --new-bg: #e6f1e3; --changed: #9a6417; --changed-bg: #fbf0dc;
  --renamed: #3f5f93; --renamed-bg: #e5ecf7; --removed: #a64438; --removed-bg: #f8e4e1;
  --context: #7b8278; --context-bg: #eef0eb; --connector: #b3beaa; --code-bg: #f1f2ec;
  --strong: #3f7a49; --mixed: #9a6417; --weak: #a64438;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --toolbar: 52px; --rail: 224px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #e4e7e1; --muted: #a0a89c; --faint: #757d72;
  --canvas: #161816; --surface: #1d201d; --node: #232723; --line: #343a33; --hover: #2b302a;
  --accent: #93a9d3; --accent-soft: #263042; --focus-ring: #93a9d340;
  --new: #8cc493; --new-bg: #22351f; --changed: #e0b26a; --changed-bg: #3a2e18;
  --renamed: #9db7e6; --renamed-bg: #22304a; --removed: #ec9488; --removed-bg: #432520;
  --context: #a0a89c; --context-bg: #2a2e29; --connector: #4f5a4c; --code-bg: #1a1d1a;
  --strong: #8cc493; --mixed: #e0b26a; --weak: #ec9488; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --ink: #e4e7e1; --muted: #a0a89c; --faint: #757d72;
  --canvas: #161816; --surface: #1d201d; --node: #232723; --line: #343a33; --hover: #2b302a;
  --accent: #93a9d3; --accent-soft: #263042; --focus-ring: #93a9d340;
  --new: #8cc493; --new-bg: #22351f; --changed: #e0b26a; --changed-bg: #3a2e18;
  --renamed: #9db7e6; --renamed-bg: #22304a; --removed: #ec9488; --removed-bg: #432520;
  --context: #a0a89c; --context-bg: #2a2e29; --connector: #4f5a4c; --code-bg: #1a1d1a;
  --strong: #8cc493; --mixed: #e0b26a; --weak: #ec9488; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.5 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: var(--toolbar) minmax(0, 1fr); grid-template-columns: var(--rail) minmax(0, 1fr); }
.toolbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.pr-num { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.pr-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.open-gh { display: inline-flex; align-items: center; gap: 6px; }
.open-gh .gh { width: 15px; height: 15px; fill: currentColor; flex: none; }
.tool-btn { border: 1px solid var(--line); background: var(--node); border-radius: 7px; padding: 4px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.tool-btn:hover { background: var(--hover); }
.theme { position: relative; }
.theme-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--hover); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.theme-btn:hover, .theme-btn[aria-expanded="true"] { background: var(--line); }
.theme-btn svg, .theme-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }
.theme-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 184px; background: var(--node); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px #0000001f; display: grid; gap: 2px; }
.theme-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid transparent; background: none; border-radius: 10px; padding: 9px 12px; cursor: pointer; color: var(--muted); font-size: 14px; text-align: left; }
.theme-item:hover { background: var(--hover); color: var(--ink); }
.theme-item[aria-checked="true"] { border-color: var(--connector); color: var(--ink); font-weight: 500; }
.theme-item .check { margin-left: auto; width: 16px; height: 16px; visibility: hidden; }
.theme-item[aria-checked="true"] .check { visibility: visible; }
.menu-toggle { display: none; }

.rail { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.rail-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 10px 8px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 7px; cursor: pointer; color: var(--ink); }
.nav:hover { background: var(--hover); }
.nav[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.legend { display: grid; gap: 6px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .02em; border-radius: 999px; padding: 1px 8px; white-space: nowrap; line-height: 18px; }
.pill.new { color: var(--new); background: var(--new-bg); } .pill.changed { color: var(--changed); background: var(--changed-bg); }
.pill.renamed { color: var(--renamed); background: var(--renamed-bg); } .pill.removed { color: var(--removed); background: var(--removed-bg); }
.pill.context, .pill.same { color: var(--context); background: var(--context-bg); }
.pill.strong { color: var(--strong); background: var(--new-bg); } .pill.mixed { color: var(--mixed); background: var(--changed-bg); } .pill.weak { color: var(--weak); background: var(--removed-bg); }
.pill.pass { color: var(--new); background: var(--new-bg); } .pill.warn { color: var(--changed); background: var(--changed-bg); } .pill.skip, .pill.fail { color: var(--removed); background: var(--removed-bg); }

.main { position: relative; overflow: hidden; min-width: 0; }
.viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.viewport.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges path { fill: none; stroke: var(--connector); stroke-width: 1.5; }
.edges path.dashed { stroke-dasharray: 5 4; }
.edge-label { position: absolute; font-size: 11px; color: var(--muted); background: var(--canvas); padding: 0 5px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -50%); pointer-events: none; }
.group-title { position: absolute; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.board-intro { position: absolute; font-size: 13px; color: var(--muted); max-width: 760px; }

.node { position: absolute; width: 300px; background: var(--node); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; box-shadow: 0 1px 2px #0000000a; }
.node:hover { border-color: var(--connector); }
.node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.node.st-new { background: linear-gradient(var(--node), var(--node)) padding-box; border-color: color-mix(in srgb, var(--new) 45%, var(--line)); }
.node.st-context { opacity: .78; border-style: dashed; }
.node-head { display: flex; align-items: center; gap: 8px; }
.node-title { font-weight: 600; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.node-head .pill { margin-left: auto; }
.node-kind { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.node-sum { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.node-num { font-family: var(--mono); font-size: 11px; color: var(--faint); min-width: 18px; }
.node.table { width: 340px; padding: 0; overflow: hidden; }
.node.table .node-head { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.node.table .node-title { font-family: var(--mono); font-size: 13px; }
.cols { list-style: none; margin: 0; padding: 6px 0; }
.col { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: baseline; padding: 2px 14px; font-family: var(--mono); font-size: 12px; }
.col .t { color: var(--faint); font-size: 11px; white-space: nowrap; }
.col .m { font-weight: 600; text-align: center; }
.col.new { background: var(--new-bg); } .col.new .m { color: var(--new); }
.col.changed .m { color: var(--changed); } .col.renamed { background: var(--renamed-bg); } .col.renamed .m { color: var(--renamed); }
.col.removed .n { text-decoration: line-through; color: var(--removed); } .col.removed .m { color: var(--removed); }
.col .from, .col .ref { color: var(--faint); font-size: 11px; }
.col .ref { color: var(--accent); }
.node-foot { border-top: 1px solid var(--line); padding: 7px 14px; font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.node.rating-strong { border-left: 3px solid var(--strong); } .node.rating-mixed { border-left: 3px solid var(--mixed); } .node.rating-weak { border-left: 3px solid var(--weak); }
.node.flag { border-left: 3px solid var(--removed); }

.zoom { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.zoom button { border: 0; background: none; border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 13px; }
.zoom button:hover { background: var(--hover); }
.zoom .lvl { font-family: var(--mono); font-size: 11px; color: var(--muted); align-self: center; padding: 0 6px; min-width: 44px; text-align: center; }

.doc { position: absolute; inset: 0; overflow-y: auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.doc-inner { max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }
.doc h1 { font-size: 22px; line-height: 1.3; margin: 0; text-wrap: balance; }
.doc h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.doc p { margin: 0; max-width: 68ch; }
.sub { color: var(--muted); }
.list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.jump { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.jump button { border: 1px solid var(--line); background: var(--node); border-radius: 10px; padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 4px; }
.jump button:hover { border-color: var(--connector); }
.jump b { font-size: 14px; } .jump span { font-size: 12px; color: var(--muted); }
.diffline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.diffline .sep { color: var(--faint); }
.diffstat { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
.diffstat .add { color: var(--new); } .diffstat .del { color: var(--removed); }
.sqs { display: inline-flex; gap: 2px; }
.sq { width: 10px; height: 10px; border-radius: 2px; background: var(--context-bg); border: 1px solid var(--line); }
.sq.g { background: var(--new); border-color: var(--new); } .sq.r { background: var(--removed); border-color: var(--removed); }
.caps { display: grid; gap: 22px; max-width: 760px; }
.cap-head { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 650; color: var(--ink); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.cap-head svg { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.cap ul { margin: 0; padding-left: 21px; display: grid; gap: 2px; font-size: 13.5px; line-height: 1.5; }
.cap li::marker { color: var(--faint); }
.points { margin: 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.5; }
.points li::marker { color: var(--faint); }
.cap-sub { margin: 14px 0 4px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.cap-head + .cap-sub { margin-top: 0; }
.caps code, .insp-body code { font-family: var(--mono); font-size: .88em; background: var(--hover); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.subhead { margin: 14px 0 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
.subhead:first-of-type { margin-top: 0; }
.stack { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.stack a { color: inherit; text-decoration: none; border-radius: 4px; padding: 1px 3px; margin: -1px -3px; }
.stack a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.stack .cur { color: var(--ink); font-weight: 600; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; align-items: start; background: var(--node); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.row .row-title { font-weight: 600; }
.row .row-detail { grid-column: 2; color: var(--muted); font-size: 13px; }
.media-card { display: grid; gap: 4px; background: var(--node); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.callout { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-size: 13px; }

.insp-body, .insp-body > *, .ba > * { min-width: 0; }
.win { position: absolute; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 36px #0000002b, 0 1px 3px #0000001a; overflow: hidden; min-width: 0; }
.win.focused { border-color: var(--connector); }
.win.max { left: 12px !important; top: 12px !important; width: calc(100% - 24px) !important; height: calc(100% - 24px) !important; }
.win-bar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; background: var(--code-bg); border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; min-width: 0; }
.win-bar:active { cursor: grabbing; }
.win.max .win-bar { cursor: default; }
.win-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.win-kind { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.win-actions { display: flex; gap: 2px; margin-left: auto; flex: none; }
.win-actions button { border: 0; background: none; width: 30px; height: 30px; border-radius: 7px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.win-actions button:hover { background: var(--hover); color: var(--ink); }
.win-actions svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.win-tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; background: var(--surface); }
.win-tabs button { border: 0; background: none; padding: 7px 10px 9px; font-size: 13px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.win-tabs button:hover { color: var(--ink); }
.tab-n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 3px; border-radius: 9px; background: var(--hover); font-size: 11px; font-weight: 500; line-height: 18px; text-align: center; color: var(--muted); }
.win-tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.win-body { flex: 1; overflow: auto; min-height: 0; }
.win-meta { padding: 10px 18px 0; font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.win-edge { position: absolute; z-index: 2; touch-action: none; }
.win-edge.e { top: 0; right: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.win-edge.w { top: 0; left: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.win-edge.s { left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
.win-edge.se { right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; }
.win-edge.sw { left: 0; bottom: 0; width: 16px; height: 16px; cursor: nesw-resize; }
.win.max .win-edge { display: none; }
@media (max-width: 820px) { .win { left: 8px !important; top: 8px !important; width: calc(100% - 16px) !important; height: calc(100% - 16px) !important; } .win-edge, .win-actions [data-act="max"] { display: none; } }
.insp-body { padding: 16px 18px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.insp-body h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.insp-body p { margin: 0; }
.lead { font-weight: 500; }
table.props { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.props td { border-top: 1px solid var(--line); padding: 7px 6px 7px 0; vertical-align: top; }
table.props td:first-child { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
table.props .ty { font-family: var(--mono); font-size: 11px; color: var(--faint); }
table.props .ds { color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 12px/1.55 var(--mono); overflow-x: auto; white-space: pre; }
.ex-row { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--node); }
.ex-row + .ex-row { margin-top: 10px; }
.ex-row .ex-cap { font-size: 12px; font-weight: 600; padding: 7px 10px; background: var(--code-bg); border-bottom: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; font-size: 12px; }
.kv > div { padding: 4px 10px; border-top: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.kv > div:nth-child(-n+2) { border-top: 0; }
.kv .k { font-family: var(--mono); color: var(--muted); font-size: 11.5px; }
.kv .v { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; }
.kv .v.null { color: var(--faint); }
.kv .mark-new { background: var(--new-bg); } .kv .mark-changed { background: var(--changed-bg); } .kv .mark-renamed { background: var(--renamed-bg); }
.who { font-family: var(--font); color: var(--accent); font-size: 11px; margin-left: 4px; }
.ldiff { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.ldiff-head { padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); background: var(--surface); }
.ldiff-head .add { color: var(--new); font-weight: 600; } .ldiff-head .del { color: var(--removed); font-weight: 600; }
.ldiff-body { overflow-x: auto; } .ldiff-body table { min-width: 100%; border-collapse: collapse; font: 12px/1.6 var(--mono); }
.ldiff td { padding: 0 8px; white-space: pre; vertical-align: top; }
.ldiff td.ln { width: 1%; min-width: 28px; text-align: right; color: var(--faint); user-select: none; font-size: 11px; }
.ldiff td.sg { width: 1%; padding: 0 2px 0 4px; user-select: none; }
.ldiff td.tx { width: 100%; padding-right: 16px; }
.ldiff tr.add { background: var(--new-bg); } .ldiff tr.add td.sg, .ldiff tr.add td.tx { color: var(--new); }
.ldiff tr.del { background: var(--removed-bg); } .ldiff tr.del td.sg, .ldiff tr.del td.tx { color: var(--removed); }
.ba { display: grid; grid-template-columns: 1fr; gap: 10px; }
.ba-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.facts { display: grid; gap: 10px; }
.fact b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.ev { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }

/* Pan and zoom board. */
let cam = { x: 40, y: 40, k: 1 };
let world, viewport, zoomLabel;

/* Fit shows everything; the first view keeps text readable and starts at the top left when everything would be too small. */

  cam.k = readable ? Math.min(1, Math.max(0.8, whole)) : Math.max(0.25, whole);
  cam.x = Math.max(24, (vw - w * cam.k) / 2); cam.y = 24; setCam();
}
function mountBoard(build) {
  const main = $('#main');
  main.innerHTML = `<div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges" id="edges"></svg></div></div>
    <div class="zoom"><button data-z="out" aria-label="Zoom out">−</button><span class="lvl" id="zoomLvl">100%</span><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit">Fit</button></div>`;
  viewport = $('#viewport'); world = $('#world'); zoomLabel = $('#zoomLvl');
  const edges = build(world);
  world.style.width = world.scrollWidth + 'px'; world.style.height = world.scrollHeight + 'px';
  drawEdges(edges || []);
  fit(true);
  $('.zoom').addEventListener('click', e => { const z = e.target.closest('button')?.dataset.z; if (!z) return; const r = viewport.getBoundingClientRect();
    if (z === 'fit') fit(); else zoomAt(z === 'in' ? 1.2 : 1 / 1.2, r.width / 2, r.height / 2); });
  let gesture = null;
  viewport.addEventListener('wheel', e => { e.preventDefault(); const r = viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    else { cam.x -= e.deltaX; cam.y -= e.deltaY; setCam(); } }, { passive: false });
  viewport.addEventListener('gesturestart', e => { e.preventDefault(); gesture = cam.k; });
  viewport.addEventListener('gesturechange', e => { e.preventDefault(); if (gesture == null) return; const r = viewport.getBoundingClientRect(); zoomAt((gesture * e.scale) / cam.k, e.clientX - r.left, e.clientY - r.top); });
  viewport.addEventListener('gestureend', () => { gesture = null; });
  let drag = null;
  viewport.addEventListener('pointerdown', e => { if (e.target.closest('.node')) return; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; viewport.setPointerCapture(e.pointerId); viewport.classList.add('dragging'); });
  viewport.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; cam.x = drag.cx + dx; cam.y = drag.cy + dy; setCam(); });
  viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });

  world.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('node')) { e.preventDefault(); selectNode(e.target.dataset.id); } });
}
let nodeHandlers = {};
function selectNode(id) {

}
function placeNode(html, x, y, id, extraClass = '') {
  const el = document.createElement('div');
  el.className = 'node ' + extraClass; el.dataset.id = id; el.tabIndex = 0; el.setAttribute('role', 'button');
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.innerHTML = html; world.appendChild(el); return el;
}
function placeText(cls, text, x, y) { const el = document.createElement('div'); el.className = cls; el.style.left = x + 'px'; el.style.top = y + 'px'; el.textContent = text; world.appendChild(el); return el; }
function drawEdges(list) {
  const svg = $('#edges'); svg.setAttribute('width', world.scrollWidth); svg.setAttribute('height', world.scrollHeight);
  const box = (id, col) => { const n = world.querySelector(`.node[data-id="${CSS.escape(id)}"]`); if (!n) return null;
    const row = col && n.querySelector(`[data-col="${CSS.escape(col)}"]`);
    return { x: n.offsetLeft, y: n.offsetTop, w: n.offsetWidth, h: n.offsetHeight, ay: row ? row.offsetTop + row.offsetHeight / 2 : 40 }; };

    let p1, p2, c1, c2;
    if (a.x + a.w < b.x) { p1 = [a.x + a.w, a.y + a.ay]; p2 = [b.x, b.y + b.ay]; }
    else if (b.x + b.w < a.x) { p1 = [a.x, a.y + a.ay]; p2 = [b.x + b.w, b.y + b.ay]; }
    else if (a.y + a.h < b.y) { p1 = [a.x + a.w / 2, a.y + a.h]; p2 = [b.x + b.w / 2, b.y]; }

}
/* Columns of compact nodes for every board that is not the schema. */
function columnBoard(intro, groups, makeNode, opts = {}) {

/* A heading over a short bulleted list; a string still renders, as one paragraph. */
