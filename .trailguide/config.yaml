schemaVersion: 2
sources:
  pstack:
    repository: https://github.com/cursor/plugins.git
    ref: 699e1e7488c53c05ca13409f40da83cd37682091
    skills:
      forks:
        pstack/skills/show-me-your-work:
          as: skills/show-me-your-work
          basedOn: "699e1e7488c53c05ca13409f40da83cd37682091"
          reason: pstack's version reads Cursor's transcript folder and takes its review model settings from poteto-mode; the fork works in any agent harness and pairs Claude and Codex for review.
        pstack/skills/create-verification-skill:
          as: skills/create-verification-skill
          basedOn: "699e1e7488c53c05ca13409f40da83cd37682091"
          reason: Use the project's authored skill location instead of hardcoding `.cursor/skills/`, and make every proof read the output as its user would, pinning exact text only where users or scripts rely on it.
        pstack/skills/maintain-verification-skill:
          as: skills/maintain-verification-skill
          basedOn: "699e1e7488c53c05ca13409f40da83cd37682091"
          reason: Discover verification skills across project-configured skill locations
            instead of a Cursor-only directory, respect the host concurrency limit, and read each drive's output
            as its user would, so confusing output is a finding even when pinned checks pass.
  dzhng:
    repository: https://github.com/dzhng/skills.git
    ref: dc8f546c3adaa615ab86e8328449ae6efe23aca4
    skills:
      forks:
        skills/engineering/ratchet-files:
          as: skills/ratchet-files
          basedOn: "dc8f546c3adaa615ab86e8328449ae6efe23aca4"
          reason: Upstream's SKILL.md frontmatter has an unquoted colon that Trail Guide can't read; the fork quotes it and labels the skill a playbook.
