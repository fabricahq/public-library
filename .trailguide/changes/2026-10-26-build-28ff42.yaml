summary: 'Adds a section for review findings: classify each finding, and hand back an unspecified policy choice as a decision instead of choosing it; at a design checkpoint (a second finding on one mechanism, a finding in code the last fix added, a changed meaning, or persistence or restrictions the plan didn't name) write the mechanism's contract before patching and hand back its open questions; turn findings outside the acceptance criteria into follow-up tickets; and after two review rounds from one reviewer, hand back and ask whether to keep iterating. Now cites practices/code-design/record-facts-when-they-happen.'
