summary: 'Adds a section for review findings: after a second finding about one mechanism, stop patching and hand back the design question or flaw it points to as a decision, resuming once the answer is written down; turn findings outside the acceptance criteria into follow-up tickets; and after two review rounds from one reviewer, hand back and ask whether to keep iterating. Now cites practices/code-design/record-facts-when-they-happen.'
