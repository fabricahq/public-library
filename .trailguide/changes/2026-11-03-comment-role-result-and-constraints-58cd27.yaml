summary: 'Exported functions, classes, methods, types, and components need a doc comment stating intent and every guarantee callers rely on, with an eslint-plugin-jsdoc configuration that checks that scope; unexported functions need one only when their intent isn''t apparent; file headers are no longer required on every file, and guidance on constraints, TODOs, and body comments moved to the Documentation practice rules.'
rules:
  techs/typescript/comment-role-result-and-constraints: major
