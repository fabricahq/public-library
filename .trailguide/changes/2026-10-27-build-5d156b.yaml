summary: When the project has a verification skill, build now writes a journey for each user-facing behavior the slice adds or changes, covering the failure, recovery, undo, and nothing-to-do cases that apply, before building, with what the user should be able to tell and the end state rather than pinned output, puts output that users or scripts rely on word for word under automated tests, and proves the slice by driving those journeys and reading their output as the user would; projects without one get a hand-back suggestion to run create-verification-skill.
skills:
  skills/build: major
