name: Concurrency
description: Keep shared resources safe for concurrent users, apply asynchronous results only while valid, and honor cancellation and deadlines throughout blocking operations.
whenToRead: When planning, implementing, or reviewing concurrent operations, overlapping asynchronous state updates, shared-resource initialization, replacement or cleanup, or blocking operations that support cancellation or deadlines. Common scenarios include parallel HTTP requests, background workers, database reads and writes through connection pools, replacing clients after credential rotation, cache refreshes, retries, and graceful shutdown.
