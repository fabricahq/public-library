name: Writing
description: Write readable, engaging prose for blog posts, announcements, page copy, documentation, and other writing people read for its ideas. These rules do not cover code comments; the Documentation group's "Write comments in plain, direct language" rule does.
whenToRead: Before planning, drafting, editing, or reviewing prose that people read for its ideas, such as blog posts, announcements, landing page copy, newsletters, social posts, or documentation pages, including small wording edits to existing copy. Not for code comments or docstrings, which follow the Documentation group's "Write comments in plain, direct language" rule.
